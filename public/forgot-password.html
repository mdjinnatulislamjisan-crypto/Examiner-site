<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Examiner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L3 7.5L12 12L21 7.5L12 3Z" stroke="#1B1204" stroke-width="1.7" stroke-linejoin="round"/><path d="M6 10.3V15.8C6 15.8 8 18.3 12 18.3C16 18.3 18 15.8 18 15.8V10.3" stroke="#1B1204" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 7.5V13" stroke="#1B1204" stroke-width="1.7" stroke-linecap="round"/></svg></div><span class="brand-name">Examiner</span></a>
  <div class="nav"><a class="navlink" href="login.html">Log in</a></div>
</div>
<div class="shell narrow">
  <div class="card">
    <h2>Forgot your password?</h2>
    <p class="hint">Enter your account email and we'll send a link to reset it.</p>
    <div id="msg"></div>
    <form id="forgotForm">
      <label>Email</label>
      <input type="email" id="email" required>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Send reset link</button>
    </form>
    <p class="hint" style="margin-top:14px;"><a href="login.html">← Back to login</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const data = await Api.request('/auth/forgot-password', { auth: false, method: 'POST', body: {
      email: document.getElementById('email').value,
    }});
    document.getElementById('forgotForm').style.display = 'none';
    msg.innerHTML = `<div class="ok-banner">${data.message}</div>`;
  } catch (err) {
    msg.innerHTML = `<div class="warn-banner">${err.message}</div>`;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
