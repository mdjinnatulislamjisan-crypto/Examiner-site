<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Examiner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"><strong>Examiner</strong><div class="nav"><a class="navlink" href="register.html" id="registerLink">Create account</a></div></div>
<div class="shell narrow">
  <div class="card">
    <h2>Log in</h2>
    <div id="msg"></div>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="hint" style="margin-top:14px;">No account yet? <a href="register.html" id="registerLink2">Create one</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const next = params.get('next');
if (next) {
  const target = 'register.html?next=' + encodeURIComponent(next);
  document.getElementById('registerLink').href = target;
  document.getElementById('registerLink2').href = target;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  try {
    const data = await Api.request('/auth/login', { auth: false, method: 'POST', body: {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    }});
    Api.setSession(data.token, data.user);
    window.location.href = next ? decodeURIComponent(next) : Api.homeFor(data.user);
  } catch (err) {
    msg.innerHTML = `<div class="warn-banner">${err.message}</div>`;
  }
});
</script>
</body>
</html>
