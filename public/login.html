<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Examiner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L3 7.5L12 12L21 7.5L12 3Z" stroke="#1B1204" stroke-width="1.7" stroke-linejoin="round"/><path d="M6 10.3V15.8C6 15.8 8 18.3 12 18.3C16 18.3 18 15.8 18 15.8V10.3" stroke="#1B1204" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 7.5V13" stroke="#1B1204" stroke-width="1.7" stroke-linecap="round"/></svg></div><span class="brand-name">Examiner</span></a>
  <div class="nav"><a class="navlink" href="register.html" id="registerLink">Create account</a></div>
</div>
<div class="shell narrow">
  <div class="card">
    <h2>Log in</h2>
    <div id="msg"></div>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required>
      <div class="row between" style="margin-bottom:6px;">
        <label style="margin-bottom:0;">Password</label>
        <a href="forgot-password.html" style="font-size:12.5px;">Forgot password?</a>
      </div>
      <input type="password" id="password" required>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
    </form>
    <p class="hint" style="margin-top:14px;">No account yet? <a href="register.html" id="registerLink2">Create one</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const next = params.get('next');
if (next) {
  const target = 'register.html?next=' + encodeURIComponent(next);
  document.getElementById('registerLink').href = target;
  document.getElementById('registerLink2').href = target;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  const email = document.getElementById('email').value;
  try {
    const data = await Api.request('/auth/login', { auth: false, method: 'POST', body: {
      email,
      password: document.getElementById('password').value,
    }});
    Api.setSession(data.token, data.user);
    window.location.href = next ? decodeURIComponent(next) : Api.homeFor(data.user);
  } catch (err) {
    if (err.needsVerification) {
      msg.innerHTML = `<div class="warn-banner">${err.message}</div>
        <button class="btn btn-sm" id="resendBtn" type="button">Resend verification email</button>
        <div id="resendMsg" style="margin-top:10px;"></div>`;
      document.getElementById('resendBtn').addEventListener('click', async (ev) => {
        ev.target.disabled = true;
        ev.target.textContent = 'Sending…';
        try {
          const r = await Api.request('/auth/resend-verification', { auth: false, method: 'POST', body: { email } });
          document.getElementById('resendMsg').innerHTML = `<div class="ok-banner">${r.message}</div>`;
        } catch (e2) {
          document.getElementById('resendMsg').innerHTML = `<div class="warn-banner">${e2.message}</div>`;
          ev.target.disabled = false;
          ev.target.textContent = 'Resend verification email';
        }
      });
    } else {
      msg.innerHTML = `<div class="warn-banner">${err.message}</div>`;
    }
  }
});
</script>
</body>
</html>
