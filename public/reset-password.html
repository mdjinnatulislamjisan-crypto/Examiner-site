<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Examiner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L3 7.5L12 12L21 7.5L12 3Z" stroke="#1B1204" stroke-width="1.7" stroke-linejoin="round"/><path d="M6 10.3V15.8C6 15.8 8 18.3 12 18.3C16 18.3 18 15.8 18 15.8V10.3" stroke="#1B1204" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 7.5V13" stroke="#1B1204" stroke-width="1.7" stroke-linecap="round"/></svg></div><span class="brand-name">Examiner</span></a>
  <div class="nav"><a class="navlink" href="login.html">Log in</a></div>
</div>
<div class="shell narrow">
  <div class="card">
    <h2>Set a new password</h2>
    <div id="msg"></div>
    <form id="resetForm" style="display:none;">
      <label>New password</label>
      <input type="password" id="password" minlength="8" required>
      <p class="muted" style="margin-top:-8px;">At least 8 characters.</p>
      <label>Confirm new password</label>
      <input type="password" id="confirm" minlength="8" required>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Update password</button>
    </form>
  </div>
</div>
<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const msg = document.getElementById('msg');

if (!token) {
  msg.innerHTML = '<div class="warn-banner">This link is missing its reset token. Request a new one.</div>' +
    '<p class="hint"><a href="forgot-password.html">Request a new reset link</a></p>';
} else {
  document.getElementById('resetForm').style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.innerHTML = '';
  const pw = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  if (pw !== confirm) {
    msg.innerHTML = '<div class="warn-banner">Passwords do not match.</div>';
    return;
  }
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const data = await Api.request('/auth/reset-password', { auth: false, method: 'POST', body: { token, password: pw } });
    document.getElementById('resetForm').style.display = 'none';
    msg.innerHTML = `<div class="ok-banner">${data.message}</div><p class="hint"><a href="login.html">Go to login</a></p>`;
  } catch (err) {
    msg.innerHTML = `<div class="warn-banner">${err.message}</div>` +
      (err.message && err.message.includes('expired') ? '<p class="hint"><a href="forgot-password.html">Request a new reset link</a></p>' : '');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
